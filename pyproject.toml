[project]
name = "simplejev"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.0",
]

[project.scripts]
simplejev = "simplejev.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This machine has no NVIDIA driver. torch and torchvision come only from the CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
